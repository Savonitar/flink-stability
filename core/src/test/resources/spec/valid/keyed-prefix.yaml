format: v1
kind: scenario
meta:
  name: keyed-prefix
  description: Independent one-partition state-prefix contract fixture.
runs: 1
health_retry_limit: 0
setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 1
        topics:
          - name: input
            partitions: 1
            replication_factor: 1
            input_source: { mode: generated, format: integer-sequence, total: 6 }
          - name: output
            partitions: 1
            replication_factor: 1
  flink:
    image: flink:2.2.0
    jobmanagers: 1
    taskmanagers: 1
subject:
  connectors:
    kafka:
      artifact: maven:org.apache.flink:flink-connector-kafka:5.0.0-2.2
workload:
  jobs:
    - alias: state-job
      jar: ./flink-job-generator/target/flink-job-generator.jar
      connectors: [kafka]
      parallelism: 1
      behavior: { type: keyed-prefix-v1, key_count: 2 }
      state_backend: hashmap
      state_ttl: { enabled: false }
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: EXACTLY_ONCE
        transactional_id_prefix: keyed-prefix
        transaction_id_naming_strategy: INCREMENTING
      checkpointing:
        interval: 5s
        mode: EXACTLY_ONCE
        storage: { type: filesystem }
phases:
  - name: verify-running
    steps:
      - await:
          condition: { type: job-state, job: state-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
terminal_validations:
  - type: kafka.state-prefix
    job: state-job
    cluster: main
    topic: output
    expected: input-manifest
