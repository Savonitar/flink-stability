layout=confluent-platform
command=printf '%s\\n' "$FLINK_STABILITY_KAFKA_PROPERTIES" > /tmp/flink-stability-kafka.properties\n/usr/bin/kafka-storage format --ignore-formatted -t "$CLUSTER_ID" -c /tmp/flink-stability-kafka.properties\nexec /usr/bin/kafka-server-start /tmp/flink-stability-kafka.properties
readiness=/usr/bin/kafka-broker-api-versions --bootstrap-server localhost:19092
