format: v1
kind: scenario

meta:
  name: state-recovery
  description: Stateful recovery calibration; workload identity is frozen per matrix cell.

runs: 1
health_retry_limit: 0

setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 1
        topics:
          - name: input
            partitions: 1
            replication_factor: 1
            input_source: { mode: generated, format: integer-sequence, total: 6000 }
          - { name: output, partitions: 1, replication_factor: 1 }
  flink:
    image: flink:2.2.0
    jobmanagers: 1
    taskmanagers: 1

subject:
  connectors:
    kafka:
      artifact: maven:org.apache.flink:flink-connector-kafka:5.0.0-2.2

workload:
  jobs:
    - alias: state-job
      jar: "@WORKLOAD_JAR@"
      connectors: [kafka]
      parallelism: 1
      behavior: { type: keyed-prefix-v1, key_count: 8 }
      state_backend: hashmap
      state_ttl: { enabled: false }
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: EXACTLY_ONCE
        transactional_id_prefix: state-recovery
        transaction_id_naming_strategy: INCREMENTING
      checkpointing:
        interval: 10s
        mode: EXACTLY_ONCE
        storage: { type: filesystem }
      program_args: [--processingDelayMs, "10"]

phases:
  - name: readiness
    steps:
      - await:
          condition: { type: job-state, job: state-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
      - await:
          condition: { type: checkpoint-completed, job: state-job, count: 1 }
          timeout: 2m
          on_timeout: fail

terminal_validations:
  - type: kafka.state-prefix
    job: state-job
    cluster: main
    topic: output
    expected: input-manifest
