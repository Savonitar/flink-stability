scenario:
  phases:
    - name: startup
      steps:
        - type: start
          component: kafka
        - type: wait
          wait_ms: 10000
        - type: start
          component: flink
          image: flink:1.19
          jar: ./flink-job-generator/target/flink-job-generator-0.1.0-SNAPSHOT.jar
          args:
            - --processingDelayMs 250
            - --bootstrapServers kafka:9095
          parallelism: 2
          checkpoint_interval: 1000
        - type: wait
          wait_ms: 10000

    - name: upgrade
      steps:
        - type: savepoint
          job: current
        - type: wait
          wait_ms: 10000
        - type: stop
          component: flink
        - type: wait
          wait_ms: 10000
        - type: start
          component: flink
          image: flink:1.19
          jar: ./flink-job-generator/target/flink-job-generator-0.1.0-SNAPSHOT.jar
          restore_from_savepoint: true
          args:
            - --bootstrapServers kafka:9095
            - --processingDelayMs 250
        - type: wait
          wait_ms: 10000

    - name: chaos_recovery
      steps:
        - type: kill
          component: taskmanager
        - type: wait
          wait_ms: 10000
        - type: start
          component: taskmanager
        - type: wait
          wait_ms: 10000

    - name: validation
      steps:
        - type: validate
          validations:
            - type: kafka-count
              topic: flink-output
              expected_records: 1000
            - type: kafka-unique-ids
              topic: flink-output
              expected_records: 1000
