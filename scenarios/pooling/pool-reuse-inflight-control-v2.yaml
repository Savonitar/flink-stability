format: v1
kind: scenario

meta:
  name: pool-reuse-inflight-control-v2
  description: No-kill POOLING control with delayed asynchronous checkpoints; transaction version 2.

runs: 1
health_retry_limit: 0
completion_timeout: 10m

setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 1
        transaction_version: 2
        topics:
          - name: input
            partitions: 1
            replication_factor: 1
            input_source:
              mode: generated
              format: integer-sequence
              # Controls measured 8.032-8.109 s checkpoints at 12 s spacing.
              # Same workload as the fault cell, with no kill or restart.
              total: 14000
          - name: output
            partitions: 1
            replication_factor: 1
  flink:
    image: docker.io/library/flink:2.2.0
    jobmanagers: 1
    taskmanagers: 1

subject:
  connectors:
    kafka:
      artifact: maven:org.apache.flink:flink-connector-kafka:5.0.0-2.2

workload:
  jobs:
    - alias: eos-job
      jar: ./flink-job-generator/target/flink-job-generator.jar
      connectors: [kafka]
      parallelism: 1
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: EXACTLY_ONCE
        transactional_id_prefix: pool-reuse-inflight-control-v2
        transaction_id_naming_strategy: POOLING
      checkpointing:
        interval: 12s
        mode: EXACTLY_ONCE
        storage: { type: filesystem }
      program_args: [--processingDelayMs, "5", --snapshotAsyncDelayMs, "8000"]

phases:
  - name: warmup
    steps:
      - await:
          condition: { type: job-state, job: eos-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
      - await:
          condition: { type: checkpoint-completed, job: eos-job, count: 1 }
          timeout: 2m
          on_timeout: fail

terminal_validations:
  - type: kafka.id-set
    cluster: main
    topic: output
    expected: input-manifest
    timeout: 5m
