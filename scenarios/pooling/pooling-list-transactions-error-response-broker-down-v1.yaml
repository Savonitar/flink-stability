format: v1
kind: scenario

meta:
  name: pooling-list-transactions-error-response-broker-down-v1
  description: POOLING recovery with list-transactions error-response while broker-1 is down; TV1.

runs: 1
health_retry_limit: 0

setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 3
        transaction_version: 1
        topics:
          - name: input
            partitions: 3
            replication_factor: 3
            input_source:
              mode: generated
              format: integer-sequence
              # About 90 s at 5 ms per record leaves time for a deliberate recovery.
              total: 18000
          - name: output
            partitions: 3
            replication_factor: 3
  proxies:
    kafka-proxy:
      type: kroxylicious
      cluster: main
      listen: kafka-proxy:9092
      bootstrap: { cluster: main }
  flink:
    image: docker.io/library/flink:2.2.0
    jobmanagers: 1
    taskmanagers: 1

subject:
  connectors:
    kafka:
      artifact: maven:org.apache.flink:flink-connector-kafka:5.0.0-2.2

workload:
  jobs:
    - alias: eos-job
      jar: ./flink-job-generator/target/flink-job-generator.jar
      connectors: [kafka]
      parallelism: 1
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: EXACTLY_ONCE
        transactional_id_prefix: pooling-list-transactions-error-response-broker-down-v1
        transaction_id_naming_strategy: POOLING
        connect_via_proxy: kafka-proxy
      checkpointing:
        interval: 1s
        mode: EXACTLY_ONCE
      program_args: [--processingDelayMs, "5"]

phases:
  - name: warmup
    steps:
      - await:
          condition: { type: job-state, job: eos-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
      - await:
          condition: { type: checkpoint-completed, job: eos-job, count: 1 }
          timeout: 2m
          on_timeout: fail
  - name: pooling-list-transactions-error-response-broker-down-v1
    steps:
      - kill:
          target: { kind: named, role: broker, name: broker-1 }
      - network_fault:
          proxy: kafka-proxy
          target: { cluster: main }
          match: { api: list-transactions }
          fault: { type: error-response, error: coordinator-load-in-progress }
          restart: { component: taskmanager }
          occurrences: 1
          trigger_deadline: 2m
          heal: restore-proxy-rule
      - restart: { component: kafka, name: broker-1 }

terminal_validations:
  - type: kafka.id-set
    cluster: main
    topic: output
    expected: input-manifest
