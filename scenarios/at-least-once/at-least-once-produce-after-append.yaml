format: v1
kind: scenario

meta:
  name: at-least-once-produce-after-append
  description: Explicit at-least-once guarantee under produce-after-append; duplicates counted and permitted.

runs: 1
health_retry_limit: 0
completion_timeout: 5m

setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 3
        transaction_version: 2
        topics:
          - name: input
            partitions: 3
            replication_factor: 3
            input_source:
              mode: generated
              format: integer-sequence
              total: 30000
          - name: output
            partitions: 3
            replication_factor: 3
  proxies:
    kafka-proxy:
      type: kroxylicious
      cluster: main
      listen: kafka-proxy:9092
      bootstrap: { cluster: main }
  flink:
    image: flink:2.2.0
    jobmanagers: 1
    taskmanagers: 1

subject:
  connectors:
    kafka:
      artifact: maven:org.apache.flink:flink-connector-kafka:5.0.0-2.2

workload:
  jobs:
    - alias: eos-job
      jar: ./flink-job-generator/target/flink-job-generator.jar
      connectors: [kafka]
      parallelism: 1
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: AT_LEAST_ONCE
        connect_via_proxy: kafka-proxy
      checkpointing:
        interval: 1s
        mode: EXACTLY_ONCE
      program_args: [--processingDelayMs, "5"]

phases:
  - name: warmup
    steps:
      - await:
          condition: { type: job-state, job: eos-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
      - await:
          condition: { type: checkpoint-completed, job: eos-job, count: 1 }
          timeout: 2m
          on_timeout: fail
  - name: at-least-once-produce-after-append
    steps:
      - network_fault:
          proxy: kafka-proxy
          target: { cluster: main }
          match: { api: produce, topic: output }
          fault: { type: error-after-append, error: request-timed-out }
          occurrences: 1
          trigger_deadline: 2m
          heal: restore-proxy-rule

terminal_validations:
  - type: kafka.id-set
    cluster: main
    topic: output
    expected: input-manifest
    mode: at-least-once
