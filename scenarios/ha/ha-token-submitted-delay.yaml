format: v1
kind: scenario

meta:
  name: ha-token-submitted-delay
  description: Bounded exactly-once workload with observed HA leadership and optional synthetic token faults.

parameters:
  flink_image: { type: string, required: true }
  flink_image_id: { type: string, required: true }
  runtime_jar_sha256: { type: string, required: true }
  connector_jar: { type: string, required: true }
  connector_sha256: { type: string, required: true }
  workload_jar: { type: string, required: true }

runs: 1
health_retry_limit: 0

setup:
  kafka:
    clusters:
      main:
        image: apache/kafka:4.0.0
        brokers: 1
        topics:
          - name: input
            partitions: 4
            replication_factor: 1
            input_source:
              mode: generated
              format: integer-sequence
              # Four source subtasks at 100 ms per record keep 3000 records in flight
              # for about 75 s. Fault effectiveness is verified from observed placement.
              total: 3000
          - name: output
            partitions: 4
            replication_factor: 1
  flink:
    image: "${flink_image}"
    image_id: "${flink_image_id}"
    runtime_jar:
      container_path: /opt/flink/lib/flink-dist-2.4-SNAPSHOT.jar
      sha256: "${runtime_jar_sha256}"
    jobmanagers: 2
    high_availability:
      zookeeper_image: zookeeper:3.9.3
      session_timeout: 6s
    token_provider:
      renewal_interval: 2s
      retry_backoff: 2s
      proof_scope: submitted-job
    taskmanagers: 2

subject:
  connectors:
    kafka:
      artifact: "${connector_jar}"
      sha256: "${connector_sha256}"
      runtime_dependencies:
        - maven:org.apache.commons:commons-lang3:3.18.0
        - maven:com.fasterxml.jackson.core:jackson-core:2.18.2
        - maven:com.fasterxml.jackson.core:jackson-databind:2.18.2
        - maven:com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.2
        - maven:com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2
        - maven:org.apache.kafka:kafka-clients:4.2.0

workload:
  jobs:
    - alias: eos-job
      jar: "${workload_jar}"
      connectors: [kafka]
      parallelism: 4
      source: { cluster: main, topic: input }
      sink:
        cluster: main
        topic: output
        delivery_guarantee: EXACTLY_ONCE
        transactional_id_prefix: ha-token-delay
        transaction_id_naming_strategy: INCREMENTING
      checkpointing:
        interval: 1s
        storage: { type: filesystem }
        mode: EXACTLY_ONCE
      program_args: [--processingDelayMs, "100"]

phases:
  - name: warmup
    steps:
      - await:
          condition: { type: job-state, job: eos-job, state: RUNNING }
          timeout: 2m
          on_timeout: inconclusive
      - await:
          condition: { type: checkpoint-completed, job: eos-job, count: 1 }
          timeout: 2m
          on_timeout: fail
  - name: leadership-recovery
    steps:
      - leader_fault:
          mode: isolate-zookeeper
          duration: 15s
          timeout: 2m
          token_fault:
            target: submitted-job
            mode: delay
            delay: 5s

terminal_validations:
  - type: kafka.id-set
    cluster: main
    topic: output
    expected: input-manifest
