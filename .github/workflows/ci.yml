name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      # Unit and contract tests only; they do not start Docker. The real-container
      # scenario run is the manual bounded-eos workflow.
      - name: Test Python tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build and test
        run: mvn -B -ntp verify
